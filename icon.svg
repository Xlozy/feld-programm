<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Feld-Icon: sechs verbundene Knoten</title>
<desc>Dunkles, abgerundetes Quadrat (Graphit) als Hintergrund mit sechs hellen, durch Linien zu einem Sechseck verbundenen Knoten als Sinnbild für Knotenpunkte in einem Netz.</desc>
<rect x="0" y="0" width="512" height="512" rx="114" fill="#15171a"/>
<g stroke="#e8e9eb" stroke-width="16" stroke-linecap="round">
<line x1="256.0" y1="128.0" x2="366.9" y2="192.0"/>
<line x1="366.9" y1="192.0" x2="366.9" y2="320.0"/>
<line x1="366.9" y1="320.0" x2="256.0" y2="384.0"/>
<line x1="256.0" y1="384.0" x2="145.1" y2="320.0"/>
<line x1="145.1" y1="320.0" x2="145.1" y2="192.0"/>
<line x1="145.1" y1="192.0" x2="256.0" y2="128.0"/>
</g>
<circle cx="256.0" cy="128.0" r="24" fill="#e8e9eb"/>
<circle cx="366.9" cy="192.0" r="24" fill="#e8e9eb"/>
<circle cx="366.9" cy="320.0" r="24" fill="#e8e9eb"/>
<circle cx="256.0" cy="384.0" r="24" fill="#e8e9eb"/>
<circle cx="145.1" cy="320.0" r="24" fill="#e8e9eb"/>
<circle cx="145.1" cy="192.0" r="24" fill="#e8e9eb"/>
</svg>
